services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: korp
      POSTGRES_PASSWORD: korp
      POSTGRES_DB: korp_stock
    ports:
      - "5433:5432"
    volumes:
      - korp_pg:/var/lib/postgresql/data
      - ./infra/init-db.sql:/docker-entrypoint-initdb.d/init-db.sql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U korp -d korp_stock"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  korp_pg:
